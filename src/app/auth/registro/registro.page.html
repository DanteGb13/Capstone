<ion-content [fullscreen]="true">

  <div class="register-page">

    <!-- Botón volver -->
    <div class="back-container">
      <ion-button fill="clear" class="back-button" [routerLink]="['/login']">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </div>

    <!-- Encabezado -->
    <div class="register-header">
      <h1>Crear cuenta</h1>
      <p>Regístrate para comenzar a usar la app</p>
    </div>

    <!-- Formulario -->
    <div class="register-form">

      <!-- Nombre completo -->
      <ion-input
        type="text"
        placeholder="Nombre completo"
        fill="outline"
        class="register-input"
        [(ngModel)]="nombreCompleto">

        <ion-icon
          slot="start"
          name="person-outline">
        </ion-icon>

      </ion-input>

      <!-- Teléfono -->
      <ion-input
        type="tel"
        placeholder="Teléfono de contacto"
        fill="outline"
        class="register-input"
        [(ngModel)]="telefono">

        <ion-icon
          slot="start"
          name="call-outline">
        </ion-icon>

      </ion-input>

      <!-- Correo -->
      <ion-input
        type="email"
        placeholder="Correo"
        fill="outline"
        class="register-input"
        [(ngModel)]="correo">

        <ion-icon
          slot="start"
          name="mail-outline">
        </ion-icon>

      </ion-input>

      <!-- Contraseña -->
      <ion-input
        type="password"
        placeholder="Contraseña"
        fill="outline"
        class="register-input"
        [(ngModel)]="contrasena">

        <ion-icon
          slot="start"
          name="lock-closed-outline">
        </ion-icon>

      </ion-input>

      <!-- Confirmar contraseña -->
      <ion-input
        type="password"
        placeholder="Confirmar Contraseña"
        fill="outline"
        class="register-input"
        [(ngModel)]="confirmarContrasena">

        <ion-icon
          slot="start"
          name="lock-closed-outline">
        </ion-icon>

      </ion-input>

    </div>

    <!-- Tipo de cuenta -->
    <div class="account-type">

      <h2>
        Selecciona el tipo de cuenta:
        <strong>{{ tipoCuenta }}</strong>
      </h2>

      <div class="account-options">

        <button
          type="button"
          class="account-option"
          [class.active]="tipoCuenta === 'Usuario'"
          (click)="seleccionarTipo('Usuario')">

          Usuario

        </button>

        <button
          type="button"
          class="account-option"
          [class.active]="tipoCuenta === 'Familiar'"
          (click)="seleccionarTipo('Familiar')">

          Familiar

        </button>

      </div>

    </div>

    <!-- Error -->
    @if (mensajeError) {

      <p class="error-message">
        {{ mensajeError }}
      </p>

    }

    <!-- Registrarse -->
    <ion-button
      expand="block"
      class="register-button"
      (click)="registrar()"
      [disabled]="cargando">

      {{ cargando ? 'Registrando...' : 'Registrarse' }}

    </ion-button>

    <!-- Google -->
    <ion-button
      expand="block"
      fill="outline"
      class="google-button"
      (click)="registrarConGoogle()"
      [disabled]="cargando">

      <ion-icon
        name="logo-google"
        slot="start"
        class="google-icon">
      </ion-icon>

      Continuar con Google

    </ion-button>

    <!-- Login -->
    <div class="login-link">
      <span>¿Ya tienes una cuenta?</span>
      <a [routerLink]="['/login']">Inicia sesión</a>
    </div>

  </div>

</ion-content>
