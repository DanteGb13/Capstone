<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="ajustes-container">

    <div class="ajustes-card" (click)="irAPermisos()">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <span>Permisos</span>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <div class="ajustes-card" (click)="irATamanoLetra()">
      <ion-icon name="text-outline"></ion-icon>
      <span>Tamaño de letra</span>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <div class="ajustes-card deshabilitado">
      <ion-icon name="person-outline"></ion-icon>
      <span>Mi perfil</span>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <div class="ajustes-card deshabilitado">
      <ion-icon name="notifications-outline"></ion-icon>
      <span>Notificaciones</span>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <div class="ajustes-card deshabilitado">
      <ion-icon name="map-outline"></ion-icon>
      <span>Mapa y rutas</span>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

  </div>

</ion-content>
