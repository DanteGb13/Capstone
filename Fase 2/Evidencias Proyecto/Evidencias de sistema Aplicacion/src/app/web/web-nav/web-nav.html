<nav class="web-nav">
  <div class="web-nav__fila">

    <a class="web-nav__marca" routerLink="/inicio" (click)="cerrarMenu()">
      <img class="web-nav__logo" src="/assets/logo/logo-128.png" alt="" />
      <span>SiempreCerca</span>
    </a>

    <button
      type="button"
      class="web-nav__toggle"
      [class.web-nav__toggle--abierto]="menuAbierto"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="web-nav-panel"
      aria-label="Menú de navegación"
      (click)="alternarMenu()">
      <span class="web-nav__barra"></span>
      <span class="web-nav__barra"></span>
      <span class="web-nav__barra"></span>
    </button>

    <div
      id="web-nav-panel"
      class="web-nav__panel"
      [class.web-nav__panel--abierto]="menuAbierto">

      <div class="web-nav__enlaces">
        <a routerLink="/inicio" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }"
           (click)="cerrarMenu()">Inicio</a>
        <a routerLink="/planes" routerLinkActive="activo" (click)="cerrarMenu()">Planes</a>
        <a routerLink="/descarga" routerLinkActive="activo" (click)="cerrarMenu()">Descarga</a>
        <a routerLink="/contactanos" routerLinkActive="activo" (click)="cerrarMenu()">Contáctanos</a>
      </div>

      <a class="web-nav__login" routerLink="/login" (click)="cerrarMenu()">Login</a>

    </div>

  </div>
</nav>
