<nav class="web-nav">
  <div class="web-nav__fila">

    <a class="web-nav__marca" routerLink="/inicio" (click)="cerrarMenu()">
      <img class="web-nav__logo" src="/assets/logo/logo-128.png" alt="" />
      <span>SiempreCerca</span>
    </a>

    <button
      type="button"
      class="web-nav__toggle"
      [class.web-nav__toggle--abierto]="menuAbierto"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="web-nav-panel"
      aria-label="Menú de navegación"
      (click)="alternarMenu()">
      <span class="web-nav__barra"></span>
      <span class="web-nav__barra"></span>
      <span class="web-nav__barra"></span>
    </button>

    <div
      id="web-nav-panel"
      class="web-nav__panel"
      [class.web-nav__panel--abierto]="menuAbierto">

      <!--
        Mientras se resuelve el rol no se pinta nada: si no, en una pantalla
        del panel aparecería la landing de la web pública un instante.
      -->
      @if (!cargando) {

        <div class="web-nav__enlaces">
          @for (item of enlaces; track item.ruta) {
            <a
              [routerLink]="item.ruta"
              routerLinkActive="activo"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="cerrarMenu()">{{ item.etiqueta }}</a>
          }
        </div>

        <!--
          A la derecha: el mini perfil del Administrador si lo es; si no, el
          botón de acceso cuando no hay sesión, o la salida cuando la hay. Un
          Familiar o un Usuario entra por /acceso pero no tiene panel propio,
          así que para ellos sólo queda cerrar sesión.
        -->
        @if (esAdmin) {
          <div class="web-nav__perfil">
            <button
              type="button"
              class="web-nav__perfil-boton"
              [class.web-nav__perfil-boton--activo]="perfilAbierto"
              [attr.aria-expanded]="perfilAbierto"
              aria-controls="web-nav-perfil"
              (click)="alternarPerfil(); $event.stopPropagation()">
              <!--
                Si hay foto va la foto; si no, las iniciales. La foto se sube
                desde Mi Perfil y la cachea PerfilCacheService, así que no
                cambia nada del resto de la barra.
              -->
              @if (perfil?.fotoUrl) {
                <img
                  class="web-nav__avatar web-nav__avatar-foto"
                  [src]="perfil.fotoUrl"
                  alt="" />
              } @else {
                <span class="web-nav__avatar">{{ iniciales || 'AD' }}</span>
              }
              <span class="web-nav__perfil-nombre">{{ perfil?.nombreCompleto || 'Administrador' }}</span>
            </button>

            <div
              id="web-nav-perfil"
              class="web-nav__perfil-menu"
              [class.web-nav__perfil-menu--abierto]="perfilAbierto">
              <a routerLink="/mi-perfil" (click)="cerrarMenu()">Perfil</a>
              <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
            </div>
          </div>
        } @else if (logueado) {
          <button type="button" class="web-nav__salir" (click)="cerrarSesion()">Cerrar sesión</button>
        } @else {
          <a class="web-nav__login" routerLink="/acceso" (click)="cerrarMenu()">Entrar</a>
        }

      }

    </div>

  </div>
</nav>
