<app-web-nav />

<ion-content class="web-contenido">
  <div class="web-page">

    <div class="panel-cabecera">
      <h1>Panel de control</h1>
      <p class="descripcion">Administración de SiempreCerca.</p>
    </div>

    <div class="panel-accesos">
      @for (seccion of secciones; track seccion.ruta) {
        <a class="panel-acceso" [routerLink]="seccion.ruta">
          <span class="panel-acceso__titulo">{{ seccion.titulo }}</span>
          <span class="panel-acceso__detalle">{{ seccion.detalle }}</span>
        </a>
      }
    </div>

  </div>
</ion-content>
