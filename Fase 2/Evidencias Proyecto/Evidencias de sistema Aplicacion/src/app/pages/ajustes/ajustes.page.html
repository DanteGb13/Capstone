<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="ajustes-container">

    <!--
      Cada tarjeta lleva `aria-label` aunque su texto ya sea legible.

      No es redundante: sin él, quien lee en voz alta anunciaría el texto
      concatenado de la tarjeta, o sea "Tamaño de letraGrande", porque el
      nombre y el estado están en dos elementos distintos. Con la etiqueta se
      anuncia el nombre y el estado se lee aparte.
    -->
    <div class="ajustes-card" aria-label="Permisos" (click)="irAPermisos()">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <span>Permisos</span>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <h2 class="ajustes-seccion">Accesibilidad</h2>

    <div class="ajustes-card" aria-label="Tamaño de letra" (click)="irATamanoLetra()">
      <ion-icon name="text-outline"></ion-icon>
      <div class="ajustes-texto">
        <span>Tamaño de letra</span>
        <span class="ajustes-estado">{{ fontService.obtenerEtiqueta() }}</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <div class="ajustes-card" aria-label="Filtro para daltónicos" (click)="irAFiltroColor()">
      <ion-icon name="color-filter-outline"></ion-icon>
      <div class="ajustes-texto">
        <span>Filtro para daltónicos</span>
        <span class="ajustes-estado">{{ colorService.resumen() }}</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <div class="ajustes-card" aria-label="Leer en voz alta" (click)="irAVoz()">
      <ion-icon name="volume-high-outline"></ion-icon>
      <div class="ajustes-texto">
        <span>Leer en voz alta</span>
        <span class="ajustes-estado">{{ voz.resumen() }}</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <h2 class="ajustes-seccion">Seguridad y privacidad</h2>

    <div class="ajustes-card" aria-label="Políticas, Privacidad y Seguridad" (click)="irAPrivacidad()">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <div class="ajustes-texto">
        <span>Políticas, Privacidad y Seguridad</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>

    <!--
      SEGURIDAD / SENSOR DE CAÍDAS - OCULTO A PROPÓSITO.

      Decidido no implementarlo todavía. Se deja el bloque entero comentado (y no
      borrado) para que no se pierda y para poder volver en una línea.

      Para volver a mostrarlo: descomentar este bloque tal cual. La tarjeta
      vuelve a salir en su estado "Próximamente" y no lleva manejador de click,
      así que no hace falta tocar nada más.

      Ojo con lo que falta cuando se retome: no es sólo esta tarjeta. El
      detector necesita acelerómetro Y un contador de pasos, correr dentro de
      `UbicacionForegroundService` (no en un servicio nuevo, para no tener dos
      notificaciones permanentes), y enganchar con `sos.ts` por medio de una
      cuenta atrás de 30 s. Un umbral simple de aceleración NO sirve: dispararía
      cada vez que al adulto mayor se le cayera el teléfono de la mano.
    -->
    <!--
    <h2 class="ajustes-seccion">Seguridad</h2>

    <div class="ajustes-card deshabilitado" aria-label="Sensor de caídas">
      <ion-icon name="pulse-outline"></ion-icon>
      <div class="ajustes-texto">
        <span>Sensor de caídas</span>
        <span class="ajustes-estado">Próximamente</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="flecha"></ion-icon>
    </div>
    -->

  </div>

</ion-content>
