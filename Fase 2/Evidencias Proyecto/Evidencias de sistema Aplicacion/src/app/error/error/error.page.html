<ion-header class="error-header">
  <ion-toolbar>
    <div class="marca">
      <span class="marca-icono">
        <ion-icon name="heart-outline" aria-hidden="true"></ion-icon>
      </span>
      <span>Siempre Cerca</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="error-content">
  <main class="error-layout">
    <section class="error-card" aria-labelledby="titulo-error">
      <div class="ilustracion" aria-hidden="true">
        <span class="orb orb-superior"></span>
        <span class="orb orb-inferior"></span>
        <div class="icono-alerta">
          <ion-icon name="alert-circle-outline"></ion-icon>
        </div>
        <span class="codigo-error">404</span>
      </div>

      <p class="etiqueta-error">Página no encontrada</p>
      <h1 id="titulo-error">Parece que nos perdimos</h1>
      <p class="mensaje-error">
        El enlace puede estar equivocado o la página ya no está disponible.
        Puedes volver al lugar anterior o regresar al inicio.
      </p>

      <div class="acciones-error">
        <ion-button class="boton-inicio" href="/">
          <ion-icon name="home-outline" slot="start" aria-hidden="true"></ion-icon>
          Ir al inicio
        </ion-button>
        <ion-button class="boton-volver" fill="clear" (click)="volver()">
          <ion-icon name="arrow-back-outline" slot="start" aria-hidden="true"></ion-icon>
          Volver atrás
        </ion-button>
      </div>

      <p class="ayuda-error">Si el problema continúa, intenta abrir la página nuevamente.</p>
    </section>
  </main>
</ion-content>
